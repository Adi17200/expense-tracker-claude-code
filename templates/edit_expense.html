{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<div class="form-container">
    <header class="form-header">
        <h1>Edit Expense</h1>
        <p>Modify the details of your transaction</p>
    </header>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="POST" class="expense-form">
        <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" name="amount" id="amount" step="0.01" min="0.01" required
                   value="{{ expense.amount }}" placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select name="category" id="category" required>
                <option value="" disabled>Select a category</option>
                {% for cat in categories %}
                <option value="{{ cat }}" {% if expense.category == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" name="date" id="date" required value="{{ expense.date }}">
        </div>

        <div class="form-group">
            <label for="description">Description (Optional)</label>
            <input type="text" name="description" id="description" maxlength="200"
                   value="{{ expense.description or '' }}" placeholder="What was this for?">
        </div>

        <div class="form-actions">
            <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
            <button type="submit" class="btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
